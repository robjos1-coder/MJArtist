# Publishes the site to GitHub Pages every time anything is saved (including
# edits made in Pages CMS). Also shrinks oversized photos and, when asked,
# copies the artwork images off Wix.
#
# Security notes:
#  - every third-party action is pinned to an exact commit, so a hijacked tag
#    upstream cannot change what runs here;
#  - each job gets only the permissions it needs;
#  - only the public website files are published (tools, workflows and
#    settings in this repository are never served).
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"   # daily rebuild so the Instagram feed and "on now" exhibitions stay current
  workflow_dispatch:
    inputs:
      import_wix:
        description: "Import images from Wix (run once, before cancelling Wix)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to save optimised / imported images back
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: "pip install --only-binary=:all: --require-hashes -r tools/requirements.lock"
      - name: Import images from Wix
        if: ${{ inputs.import_wix }}
        run: python tools/import_wix_images.py
      - name: Optimise photos
        run: python tools/optimise_images.py
      - name: Check content files are valid
        run: for f in content/*.json; do python -m json.tool "$f" > /dev/null || { echo "::error file=$f::Invalid JSON"; exit 1; }; done
      - name: Save changes
        id: commit
        run: |
          if [ -n "$(git status --porcelain images content)" ]; then
            git config user.name "site-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add images content
            git commit -m "Optimise images [automated]"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: "pip install --only-binary=:all: --require-hashes -r tools/requirements.lock"
      - name: Build pages (one per artwork, sitemap, search data)
        run: python tools/build_site.py
      - name: Collect public files
        run: |
          mkdir _site
          cp -r *.html art assets content images media .well-known \
                robots.txt sitemap.xml favicon.ico site.webmanifest _site/
          [ -f CNAME ] && cp CNAME _site/ || true
          rm -f _site/SETUP-GUIDE.html   # the guide is for you, not the public site
          touch _site/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
