# Pages CMS configuration — https://pagescms.org
# This file decides what Michael sees when he logs in to edit the website.
media:
  input: images
  output: /images
  rename: safe
  extensions: [jpg, jpeg, png, webp]

content:
  - name: artworks_sculpture
    label: Artworks - Sculpture
    type: file
    path: content/artworks-sculpture.json
    format: json
    description: >-
      Sculpture only. Drag to reorder.
      To change a work's medium, delete it here and add it to the right list.
    fields:
      - name: items
        label: false
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} - {series}"
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: series
            label: Series
            type: select
            required: true
            options:
              values: ["The Creative Figure", "Music", "Abstract & Sculpture", "Mechanical", "Animals", "Landscapes", "Topiary"]
          - name: stage
            label: Study or maquette?
            type: select
            options:
              values:
                - { value: "", label: "No — this is a finished work" }
                - { value: Study, label: "Study (drawing or sketch for another work)" }
                - { value: Maquette, label: "Maquette (small model for a sculpture)" }
          - name: for_work
            label: Study / maquette for
            type: string
            description: "Type the exact title of the finished work, e.g. Shiver. It will be linked on the website."
          - name: image
            label: Main photo
            type: image
            required: true
            description: Upload straight from your phone or camera — large photos are resized automatically.
          - name: more_images
            label: More photos of the same piece
            type: image
            description: Other angles, details or installation shots. Don't make a new artwork for these.
            options:
              multiple: true
          - name: medium
            label: Medium
            type: string
            description: "e.g. Charcoal on paper, Corten steel, Acrylic on plywood"
          - name: size
            label: Size
            type: string
            description: "e.g. 84 × 59 cm"
          - name: year
            label: Year
            type: string
          - name: price
            label: Price
            type: string
            description: Leave blank to show no price (visitors can still enquire).
          - name: status
            label: Availability
            type: select
            options:
              values:
                - { value: "", label: "Not shown" }
                - { value: available, label: Available }
                - { value: sold, label: Sold }
                - { value: private, label: Private collection }
                - { value: nfs, label: Not for sale }
          - name: hero
            label: Include in home page slideshow
            type: boolean
            default: false
            description: Pick 6–12 of the most eye-catching pieces. The slideshow starts on a random one each visit.
          - name: featured
            label: Show first on home page
            type: boolean
            default: false
            description: Moves this work to the front of the Sculpture or Creative Figure row on the home page.
          - name: notes
            label: Notes
            type: text
            description: Optional short description shown when the work is opened.
